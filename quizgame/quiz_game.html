<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ざっくり雑学クイズ！</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 2s infinite alternate; }
    @keyframes twinkle { from { opacity: 0.2; transform: scale(1); } to { opacity: 1; transform: scale(1.3); } }
    #app { position: relative; z-index: 10; width: 100%; max-width: 700px; padding: 20px; }

    /* タイトル */
    #title-screen { text-align: center; animation: fadeIn 0.8s ease; }
    .title-emoji { font-size: 80px; display: block; animation: bounce 1.5s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    .title-text { font-size: 42px; font-weight: 900; color: #fff; text-shadow: 0 0 20px #f9ca24, 0 0 40px #f0932b; margin: 10px 0; letter-spacing: 4px; }
    .title-sub { font-size: 15px; color: #dfe6e9; margin-bottom: 25px; }
    .difficulty-label { font-size: 18px; color: #a29bfe; font-weight: bold; margin-bottom: 16px; letter-spacing: 2px; }
    .difficulty-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 480px; margin: 0 auto; }
    .diff-btn {
      font-size: 20px; font-weight: 900; padding: 18px 10px;
      border: none; border-radius: 18px; cursor: pointer;
      transition: all 0.2s; letter-spacing: 2px; box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
    .diff-btn:hover { transform: scale(1.06); }
    .diff-easy   { background: linear-gradient(135deg, #00b894, #00cec9); color: #fff; }
    .diff-normal { background: linear-gradient(135deg, #f9ca24, #f0932b); color: #2d3436; }
    .diff-hard   { background: linear-gradient(135deg, #d63031, #e17055); color: #fff; }
    .diff-random { background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: #fff; }
    .diff-easy:hover   { box-shadow: 0 10px 30px rgba(0,184,148,0.5); }
    .diff-normal:hover { box-shadow: 0 10px 30px rgba(249,202,36,0.5); }
    .diff-hard:hover   { box-shadow: 0 10px 30px rgba(214,48,49,0.5); }
    .diff-random:hover { box-shadow: 0 10px 30px rgba(108,92,231,0.5); }

    /* クイズ画面 */
    #quiz-screen { display: none; animation: fadeIn 0.5s ease; }
    .diff-badge {
      display: inline-block; font-size: 12px; font-weight: bold;
      padding: 3px 12px; border-radius: 20px; margin-bottom: 10px; letter-spacing: 1px;
    }
    .badge-easy   { background: #00b894; color: #fff; }
    .badge-normal { background: #f9ca24; color: #2d3436; }
    .badge-hard   { background: #d63031; color: #fff; }
    .badge-random { background: #6c5ce7; color: #fff; }
    .progress-bar-wrap { background: rgba(255,255,255,0.15); border-radius: 20px; height: 12px; margin-bottom: 10px; overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #6c5ce7, #a29bfe); border-radius: 20px; transition: width 0.5s ease; }
    .progress-label { text-align: right; color: #a29bfe; font-size: 14px; margin-bottom: 6px; }
    .score-display { text-align: center; color: #f9ca24; font-size: 18px; font-weight: bold; margin-bottom: 12px; }
    .question-card { background: rgba(255,255,255,0.07); backdrop-filter: blur(10px); border: 2px solid rgba(255,255,255,0.15); border-radius: 24px; padding: 28px; margin-bottom: 18px; }
    .question-category { display: inline-block; background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; font-size: 12px; font-weight: bold; padding: 4px 14px; border-radius: 20px; margin-bottom: 14px; letter-spacing: 2px; }
    .question-text { font-size: 21px; font-weight: bold; color: #fff; line-height: 1.6; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .choice-btn { background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2); color: #fff; font-size: 16px; font-weight: bold; padding: 16px 12px; border-radius: 16px; cursor: pointer; transition: all 0.2s; line-height: 1.4; }
    .choice-btn:hover:not(:disabled) { background: rgba(255,255,255,0.18); transform: scale(1.03); border-color: #a29bfe; }
    .choice-btn.correct { background: linear-gradient(135deg, #00b894, #00cec9) !important; border-color: #00b894 !important; animation: correctPulse 0.4s ease; }
    .choice-btn.wrong   { background: linear-gradient(135deg, #d63031, #e17055) !important; border-color: #d63031 !important; animation: shake 0.5s ease; }
    .choice-btn.show-answer { background: linear-gradient(135deg, #00b894, #00cec9) !important; border-color: #00b894 !important; opacity: 0.7; }
    @keyframes correctPulse { 0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1); } }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
    .answer-hint { color: #fdcb6e; font-size: 15px; margin-top: 12px; min-height: 24px; font-weight: bold; }
    .next-btn { background: linear-gradient(135deg, #00b894, #00cec9); color: #fff; font-size: 19px; font-weight: bold; padding: 13px 38px; border: none; border-radius: 50px; cursor: pointer; margin-top: 18px; display: none; letter-spacing: 2px; box-shadow: 0 6px 20px rgba(0,184,148,0.4); transition: all 0.2s; }
    .next-btn:hover { transform: scale(1.05); }
    .next-btn.visible { display: inline-block; animation: fadeIn 0.4s ease; }

    /* フィードバック */
    .feedback-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
    .feedback-overlay.show { opacity: 1; }
    .feedback-emoji { font-size: 120px; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .feedback-text { font-size: 52px; font-weight: 900; letter-spacing: 6px; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.1s both; }
    @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .correct-overlay { background: rgba(0,184,148,0.85); }
    .wrong-overlay   { background: rgba(214,48,49,0.85); }

    /* 結果画面 */
    #result-screen { display: none; text-align: center; animation: fadeIn 0.8s ease; }
    .result-emoji { font-size: 80px; display: block; margin-bottom: 8px; }
    .result-title { font-size: 34px; font-weight: 900; color: #fff; margin-bottom: 6px; }
    .result-score { font-size: 65px; font-weight: 900; color: #f9ca24; text-shadow: 0 0 30px #f9ca24; margin: 8px 0; }
    .result-score span { font-size: 26px; color: #dfe6e9; }
    .result-msg { font-size: 18px; color: #dfe6e9; margin: 10px 0 18px; line-height: 1.7; }
    .category-breakdown { background: rgba(255,255,255,0.07); border-radius: 16px; padding: 16px 20px; margin: 0 0 20px; text-align: left; }
    .category-breakdown h3 { color: #a29bfe; font-size: 14px; letter-spacing: 2px; margin-bottom: 10px; text-align: center; }
    .cat-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 15px; color: #dfe6e9; }
    .cat-row:last-child { border-bottom: none; }
    .cat-name { flex: 1; }
    .cat-score { font-weight: bold; color: #f9ca24; font-size: 16px; margin-left: 10px; }
    .cat-bar-wrap { width: 100px; height: 8px; background: rgba(255,255,255,0.15); border-radius: 10px; overflow: hidden; margin-left: 10px; }
    .cat-bar { height: 100%; background: linear-gradient(90deg, #6c5ce7, #a29bfe); border-radius: 10px; }
    .result-btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .retry-btn { background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: #fff; font-size: 20px; font-weight: 900; padding: 15px 44px; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 8px 25px rgba(108,92,231,0.5); transition: all 0.2s; letter-spacing: 2px; }
    .retry-btn:hover { transform: scale(1.07); }

    /* フラッシュ・紙吹雪 */
    .screen-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99; pointer-events: none; opacity: 0; }
    .screen-flash.flash-correct { background: rgba(0,255,180,0.5); animation: flashAnim 0.4s ease; }
    .screen-flash.flash-wrong   { background: rgba(255,50,50,0.5);  animation: flashAnim 0.4s ease; }
    @keyframes flashAnim { 0% { opacity: 0.8; } 100% { opacity: 0; } }
    .confetti-piece { position: fixed; width: 12px; height: 12px; top: -20px; border-radius: 2px; pointer-events: none; z-index: 200; animation: confettiFall linear forwards; }
    @keyframes confettiFall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
    .clear-glow { animation: clearGlow 1.5s infinite alternate; }
    @keyframes clearGlow { from { text-shadow: 0 0 20px #f9ca24, 0 0 40px #f9ca24; } to { text-shadow: 0 0 40px #fdcb6e, 0 0 80px #e17055, 0 0 120px #d63031; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="screen-flash" id="screenFlash"></div>
<div class="feedback-overlay" id="feedbackOverlay">
  <div class="feedback-emoji" id="feedbackEmoji"></div>
  <div class="feedback-text" id="feedbackText"></div>
</div>

<div id="app">
  <!-- タイトル画面 -->
  <div id="title-screen">
    <span class="title-emoji">🧠</span>
    <div class="title-text">ざっくり雑学クイズ！</div>
    <div class="title-sub">全200問以上！10問ランダム出題</div>
    <div class="difficulty-label">― 難易度を選んでね ―</div>
    <div class="difficulty-btns">
      <button class="diff-btn diff-easy"   onclick="startGame('easy')">🟢 イージー</button>
      <button class="diff-btn diff-normal" onclick="startGame('normal')">🟡 ノーマル</button>
      <button class="diff-btn diff-hard"   onclick="startGame('hard')">🔴 ハード</button>
      <button class="diff-btn diff-random" onclick="startGame('random')">🎲 ランダム</button>
    </div>
  </div>

  <!-- クイズ画面 -->
  <div id="quiz-screen">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <span class="diff-badge" id="diffBadge"></span>
      <span class="progress-label" id="progressLabel">1 / 10</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar" style="width:10%"></div>
    </div>
    <div class="score-display" id="scoreDisplay">⭐ 正解: 0 問</div>
    <div class="question-card">
      <span class="question-category" id="questionCategory">カテゴリー</span>
      <div class="question-text" id="questionText">問題文</div>
      <div class="answer-hint" id="answerHint"></div>
    </div>
    <div class="choices" id="choices"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">つぎの問題へ ➡</button>
  </div>

  <!-- 結果画面 -->
  <div id="result-screen">
    <span class="result-emoji" id="resultEmoji"></span>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-msg" id="resultMsg"></div>
    <div class="category-breakdown" id="categoryBreakdown">
      <h3>📊 カテゴリー別スコア</h3>
      <div id="catRows"></div>
    </div>
    <div class="result-btns">
      <button class="retry-btn" onclick="resetGame()">🔄 もう一度あそぶ！</button>
    </div>
  </div>
</div>

<script>
// ===== 問題バンク（全200問以上） =====
const ALL_QUESTIONS = [

  // ========== EASY（イージー）==========

  // 🐾 生きもの Easy
  { difficulty:"easy", category:"🐾 生きもの", q:"世界で一番大きい動物はどれ？", choices:["アフリカゾウ","シロナガスクジラ","キリン","ホオジロザメ"], answer:1, explain:"シロナガスクジラは体長30m以上、体重200トン！地球史上最大の動物だよ。" },
  { difficulty:"easy", category:"🐾 生きもの", q:"タコの心臓はいくつある？", choices:["1つ","2つ","3つ","5つ"], answer:2, explain:"タコは心臓が3つ！エラ用が2つ＋体全体用が1つあるよ。" },
  { difficulty:"easy", category:"🐾 生きもの", q:"チーターが走る速さは時速何kmくらい？", choices:["約60km","約80km","約110km","約150km"], answer:2, explain:"チーターは時速110kmで走れる！世界最速の陸上動物だよ。" },
  { difficulty:"easy", category:"🐾 生きもの", q:"コアラが主食にしているのはどれ？", choices:["バナナ","ユーカリの葉","タケ","魚"], answer:1, explain:"コアラはユーカリの葉だけ食べるよ。毒があるけど体で分解できるんだ！" },
  { difficulty:"easy", category:"🐾 生きもの", q:"ペンギンは空を飛べる？", choices:["飛べる","飛べない","水中だけ飛べる","小さいペンギンだけ飛べる"], answer:1, explain:"ペンギンの翼はひれに進化しているので空を飛べないけど、泳ぐのが得意！" },
  { difficulty:"easy", category:"🐾 生きもの", q:"カンガルーの赤ちゃんが育つ場所は？", choices:["木の穴","土の中","おなかのふくろ","背中のこぶ"], answer:2, explain:"カンガルーのお母さんのおなかにある「育児嚢（いくじのう）」で赤ちゃんは育つよ！" },
  { difficulty:"easy", category:"🐾 生きもの", q:"パンダの好物はどれ？", choices:["バナナ","ユーカリ","タケ（竹）","さかな"], answer:2, explain:"ジャイアントパンダは竹（タケ）が大好き！1日に20kg以上食べることもあるよ。" },
  { difficulty:"easy", category:"🐾 生きもの", q:"ライオンは何科の動物？", choices:["イヌ科","クマ科","ネコ科","ウシ科"], answer:2, explain:"ライオンはネコ科の動物！家猫の遠いなかまだよ。" },
  { difficulty:"easy", category:"🐾 生きもの", q:"サメは魚類か哺乳類か？", choices:["魚類","哺乳類","は虫類","両生類"], answer:0, explain:"サメは魚類！えらで呼吸するよ。イルカやクジラは哺乳類だよ。" },
  { difficulty:"easy", category:"🐾 生きもの", q:"クモは虫（昆虫）のなかま？", choices:["そう","ちがう","種類による","昆虫のボス"], answer:1, explain:"クモは足が8本で昆虫じゃなく「クモ類」！昆虫は足が6本だよ。" },
  { difficulty:"easy", category:"🐾 生きもの", q:"カメは何類？", choices:["魚類","両生類","は虫類","哺乳類"], answer:2, explain:"カメはは虫類！肺で呼吸して、体温は外の気温に左右されるよ。" },
  { difficulty:"easy", category:"🐾 生きもの", q:"コウモリは鳥類か哺乳類か？", choices:["鳥類","哺乳類","は虫類","昆虫類"], answer:1, explain:"コウモリは空を飛ぶけど哺乳類！お乳で赤ちゃんを育てるよ。" },
  { difficulty:"easy", category:"🐾 生きもの", q:"カタツムリとナメクジの関係は？", choices:["まったく別の生きもの","同じ種類のなかま","カタツムリの子どもがナメクジ","ナメクジの子どもがカタツムリ"], answer:1, explain:"どちらも「腹足類」のなかま。貝がらがあるかないかのちがいだよ！" },
  { difficulty:"easy", category:"🐾 生きもの", q:"ホタルが光る主な理由は？", choices:["敵から身を守るため","仲間（オス・メス）を見つけるため","体が熱いから","太陽光をためているから"], answer:1, explain:"ホタルは光の点滅パターンでオス・メスがやり取りして仲間を見つけるよ！" },
  { difficulty:"easy", category:"🐾 生きもの", q:"蝶の成長の順番は？", choices:["卵→成虫→さなぎ→幼虫","卵→幼虫→さなぎ→成虫","幼虫→卵→さなぎ→成虫","さなぎ→卵→幼虫→成虫"], answer:1, explain:"蝶は「卵→幼虫→さなぎ→成虫」の順に育つ、完全変態をするよ！" },

  // 🌿 植物・自然 Easy
  { difficulty:"easy", category:"🌿 植物・自然", q:"植物が光合成をするとき出てくる気体は？", choices:["二酸化炭素","水素","酸素","窒素"], answer:2, explain:"植物は光合成で二酸化炭素を吸い、酸素を出すよ！" },
  { difficulty:"easy", category:"🌿 植物・自然", q:"虹は何色ある？", choices:["5色","6色","7色","8色"], answer:2, explain:"赤・橙・黄・緑・青・藍・紫の7色！" },
  { difficulty:"easy", category:"🌿 植物・自然", q:"桜の花びらは何枚？", choices:["4枚","5枚","6枚","8枚"], answer:1, explain:"ソメイヨシノなど一般的な桜の花びらは5枚だよ！" },
  { difficulty:"easy", category:"🌿 植物・自然", q:"水は何℃で凍る？", choices:["-10℃","-4℃","0℃","4℃"], answer:2, explain:"純粋な水は0℃（標準気圧）で凍り始めるよ！" },
  { difficulty:"easy", category:"🌿 植物・自然", q:"水は何℃で沸騰する（標準）？", choices:["80℃","90℃","100℃","120℃"], answer:2, explain:"標準的な気圧のもとでは水は100℃で沸騰するよ！" },
  { difficulty:"easy", category:"🌿 植物・自然", q:"雷が光ってから音が聞こえるまでに時間がかかる理由は？", choices:["光の方が音より速いから","音の方が光より速いから","目が耳より速いから","雲が音を遅らせるから"], answer:0, explain:"光は約30万km/秒、音は約340m/秒。だから光が先に見えて音があとから来るよ！" },
  { difficulty:"easy", category:"🌿 植物・自然", q:"ひまわりがつぼみのときに太陽を追うのは本当？", choices:["本当","ウソ","夜だけ本当","冬だけ本当"], answer:0, explain:"成長中のつぼみは太陽を追うけど、花が開くと東向きで固定されるよ！" },
  { difficulty:"easy", category:"🌿 植物・自然", q:"富士山は現在どんな山？", choices:["完全に死んだ火山","活火山","噴火中","ただの山"], answer:1, explain:"富士山は活火山！最後に噴火したのは1707年（宝永噴火）だよ。" },
  { difficulty:"easy", category:"🌿 植物・自然", q:"雪の結晶の形は？", choices:["丸形","四角形","三角形","六角形"], answer:3, explain:"雪の結晶は水の分子の並び方から六角形になるよ！" },

  // 🗾 都道府県 Easy
  { difficulty:"easy", category:"🗾 都道府県", q:"日本で一番面積が広い都道府県はどこ？", choices:["岩手県","長野県","北海道","新潟県"], answer:2, explain:"北海道！広さは約8万3000km²で日本全体の約22%もあるよ。" },
  { difficulty:"easy", category:"🗾 都道府県", q:"日本で一番面積が小さい都道府県はどこ？", choices:["東京都","大阪府","香川県","沖縄県"], answer:2, explain:"香川県！約1876km²で、うどんで有名だね。" },
  { difficulty:"easy", category:"🗾 都道府県", q:"日本の首都はどこ？", choices:["大阪","京都","東京","名古屋"], answer:2, explain:"日本の首都は東京！政府の中心機能がある都市だよ。" },
  { difficulty:"easy", category:"🗾 都道府県", q:"大阪の名物食べ物はどれ？", choices:["ずんだもち","たこ焼き","じゃじゃ麺","いかめし"], answer:1, explain:"たこ焼きは大阪を代表するソウルフード！" },
  { difficulty:"easy", category:"🗾 都道府県", q:"京都にある有名な金色のお寺は？", choices:["銀閣寺","金閣寺","東大寺","清水寺"], answer:1, explain:"金閣寺（鹿苑寺）！外壁が金箔で覆われた美しいお寺だよ。" },
  { difficulty:"easy", category:"🗾 都道府県", q:"富士山は主にどの都道府県にある？", choices:["長野県と新潟県","静岡県と山梨県","神奈川県と東京都","埼玉県と栃木県"], answer:1, explain:"富士山は静岡県と山梨県にまたがる日本最高峰（3776m）だよ！" },
  { difficulty:"easy", category:"🗾 都道府県", q:"北海道の道庁所在地はどこ？", choices:["旭川市","函館市","札幌市","釧路市"], answer:2, explain:"北海道の道庁所在地は札幌市！北海道で一番大きな都市だよ。" },

// ===== ゲーム変数 =====
let questions = [];
let current = 0;
let score = 0;
let answered = false;
let currentDifficulty = 'normal';
let categoryStats = {};

// ===== 星 =====
function createStars() {
  const c = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 3 + 1;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${1.5+Math.random()*2}s;`;
    c.appendChild(s);
  }
}

// ===== シャッフル =====
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ===== ゲーム開始 =====
function startGame(difficulty) {
  currentDifficulty = difficulty;
  const pool = difficulty === 'random'
    ? ALL_QUESTIONS
    : ALL_QUESTIONS.filter(q => q.difficulty === difficulty);

  questions = shuffle(pool).slice(0, 10);
  current = 0;
  score = 0;
  categoryStats = {};
  questions.forEach(q => {
    if (!categoryStats[q.category]) categoryStats[q.category] = { total: 0, correct: 0 };
    categoryStats[q.category].total++;
  });

  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';

  const badge = document.getElementById('diffBadge');
  const labels = { easy:'🟢 イージー', normal:'🟡 ノーマル', hard:'🔴 ハード', random:'🎲 ランダム' };
  const classes = { easy:'badge-easy', normal:'badge-normal', hard:'badge-hard', random:'badge-random' };
  badge.textContent = labels[difficulty];
  badge.className = 'diff-badge ' + classes[difficulty];

  showQuestion();
}

// ===== 問題表示 =====
function showQuestion() {
  answered = false;
  const q = questions[current];
  const num = current + 1;

  document.getElementById('progressLabel').textContent = `${num} / 10`;
  document.getElementById('progressBar').style.width = `${num * 10}%`;
  document.getElementById('scoreDisplay').textContent = `⭐ 正解: ${score} 問`;
  document.getElementById('questionCategory').textContent = q.category;
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('answerHint').textContent = '';
  document.getElementById('nextBtn').classList.remove('visible');

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  const shuffled = shuffle(q.choices.map((c, i) => ({ text: c, idx: i })));
  shuffled.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice.text;
    btn.onclick = () => selectAnswer(choice.idx, q, btn, shuffled);
    choicesEl.appendChild(btn);
  });
}

// ===== 回答処理 =====
function selectAnswer(selectedIdx, q, clickedBtn, shuffled) {
  if (answered) return;
  answered = true;
  const isCorrect = selectedIdx === q.answer;
  const buttons = document.querySelectorAll('.choice-btn');

  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (shuffled[i].idx === q.answer) btn.classList.add(isCorrect ? 'correct' : 'show-answer');
  });

  if (isCorrect) {
    score++;
    categoryStats[q.category].correct++;
    clickedBtn.classList.add('correct');
    showFeedback(true);
    flashScreen('correct');
    playBeep(true);
  } else {
    clickedBtn.classList.add('wrong');
    showFeedback(false);
    flashScreen('wrong');
    playBeep(false);
  }

  document.getElementById('answerHint').textContent = `💡 ${q.explain}`;
  document.getElementById('scoreDisplay').textContent = `⭐ 正解: ${score} 問`;
  document.getElementById('nextBtn').classList.add('visible');
}

// ===== フィードバック =====
function showFeedback(isCorrect) {
  const overlay = document.getElementById('feedbackOverlay');
  const emoji = document.getElementById('feedbackEmoji');
  const text = document.getElementById('feedbackText');
  overlay.className = 'feedback-overlay show ' + (isCorrect ? 'correct-overlay' : 'wrong-overlay');
  emoji.textContent = isCorrect
    ? ['🎉','⭐','🌟','🎊','✨'][Math.floor(Math.random()*5)]
    : ['😱','💦','😰','🙈','💥'][Math.floor(Math.random()*5)];
  text.style.color = isCorrect ? '#fff' : '#ffe0e0';
  text.textContent = isCorrect ? '正　解！' : '残　念！';
  setTimeout(() => { overlay.classList.remove('show'); }, 900);
}

// ===== フラッシュ =====
function flashScreen(type) {
  const f = document.getElementById('screenFlash');
  f.className = `screen-flash flash-${type}`;
  setTimeout(() => { f.className = 'screen-flash'; }, 400);
}

// ===== ビープ音 =====
let audioCtx = null;
function playBeep(isCorrect) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = isCorrect ? [523, 659, 784, 1047] : [400, 300];
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = isCorrect ? 'sine' : 'sawtooth';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.12 + 0.25);
      osc.start(audioCtx.currentTime + i * 0.12);
      osc.stop(audioCtx.currentTime + i * 0.12 + 0.3);
    });
  } catch(e) {}
}

// ===== 次の問題 =====
function nextQuestion() {
  current++;
  if (current >= 10) showResult();
  else showQuestion();
}

// ===== 結果表示 =====
function showResult() {
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';

  const data = getScoreData(score);
  document.getElementById('resultEmoji').textContent = data.emoji;
  document.getElementById('resultTitle').textContent = data.title;
  document.getElementById('resultTitle').style.color = data.color;
  document.getElementById('resultTitle').className = 'result-title' + (score >= 9 ? ' clear-glow' : '');
  document.getElementById('resultScore').innerHTML = `${score} <span>/ 10問</span>`;
  document.getElementById('resultMsg').textContent = data.msg;

  // カテゴリー別スコア
  const catRows = document.getElementById('catRows');
  catRows.innerHTML = '';
  Object.entries(categoryStats).forEach(([cat, st]) => {
    const pct = st.total > 0 ? (st.correct / st.total) * 100 : 0;
    const row = document.createElement('div');
    row.className = 'cat-row';
    row.innerHTML = `
      <span class="cat-name">${cat}</span>
      <div class="cat-bar-wrap"><div class="cat-bar" style="width:${pct}%"></div></div>
      <span class="cat-score">${st.correct}/${st.total}</span>
    `;
    catRows.appendChild(row);
  });

  if (score >= 8) launchConfetti();
  if (score >= 9) playClearFanfare();
}

// ===== 紙吹雪 =====
function launchConfetti() {
  const colors = ['#f9ca24','#f0932b','#6c5ce7','#00b894','#fd79a8','#74b9ff','#a29bfe','#ff7675'];
  for (let i = 0; i < 120; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `left:${Math.random()*100}vw;background:${colors[Math.floor(Math.random()*colors.length)]};width:${8+Math.random()*10}px;height:${8+Math.random()*10}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${2+Math.random()*3}s;`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }, i * 25);
  }
}

// ===== ファンファーレ =====
function playClearFanfare() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const melody = [{f:523,t:0},{f:659,t:0.15},{f:784,t:0.3},{f:1047,t:0.45},{f:784,t:0.65},{f:1047,t:0.8},{f:1319,t:1.0},{f:1047,t:1.3},{f:1319,t:1.5}];
    melody.forEach(({f,t}) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sine'; osc.frequency.value = f;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime + t);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.25);
      osc.start(audioCtx.currentTime + t); osc.stop(audioCtx.currentTime + t + 0.3);
    });
  } catch(e) {}
}

// ===== リセット =====
function resetGame() {
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('title-screen').style.display = 'block';
}

createStars();
</script>
